name: Nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency: nightly

permissions:
  contents: read

jobs:
  nightly:
    name: MANTA nightly
    runs-on: ubuntu-latest
    env:
      MANTA_SECRET_PASSWORD: ${{ secrets.MANTA_SECRET_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check the sign-in secret
        if: env.MANTA_SECRET_PASSWORD == ''
        run: |
          echo "::warning::MANTA_SECRET_PASSWORD is not set; the sign-in path will be held."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm installs MANTA from its private repository over git, and the lockfile pins it as git+ssh. For this
      # step alone: every form of github.com goes over HTTPS with the read token, and the credential header the
      # checkout left (this repo's GITHUB_TOKEN, which cannot read MANTA) is cleared, or git sends it instead.
      - run: npm ci
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.MANTA_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
          GIT_CONFIG_KEY_1: 'url.https://x-access-token:${{ secrets.MANTA_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_1: 'ssh://git@github.com/'
          GIT_CONFIG_KEY_2: 'url.https://x-access-token:${{ secrets.MANTA_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_2: 'git@github.com:'
          GIT_CONFIG_KEY_3: 'http.https://github.com/.extraheader'
          GIT_CONFIG_VALUE_3: ''

      # Chromium is kept between runs, keyed by the Playwright MANTA installs: a hit skips its download (about 5 s).
      # Its system libraries come from apt on every runner either way, with the man-db rebuild apt triggers skipped.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ "${{ steps.chromium.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps --only-shell
          fi

      - run: npm run build

      - name: Serve the build on localhost:4173
        run: |
          nohup npm run preview > preview.log 2>&1 &
          node -e "const t=Date.now();(async()=>{for(;;){try{if((await fetch('http://localhost:4173')).ok)return}catch{}if(Date.now()-t>60000){console.error('The preview server did not answer on http://localhost:4173 within 60 s.');process.exit(1)}await new Promise(r=>setTimeout(r,1000))}})()"

      # 5d1e7a42 is the "Sign in" path in sites/http_localhost_4173.json.
      - name: Scan, with the AI pass
        if: env.ANTHROPIC_API_KEY != ''
        run: npx manta scan --base http://localhost:4173 --extended --paths 5d1e7a42 --name "Nightly" --skills cluster,fix,explain,summary,adjudicate,acr --provider anthropic-api --no-nudge

      - name: Scan
        if: env.ANTHROPIC_API_KEY == ''
        run: npx manta scan --base http://localhost:4173 --extended --paths 5d1e7a42 --name "Nightly" --no-nudge

      - name: Name the artifact
        if: always()
        run: |
          echo "Artifact: manta-nightly" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manta-nightly
          retention-days: 30
          path: |
            reports/
            run-records/
            sites/
