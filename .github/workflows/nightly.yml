name: Nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency: nightly

permissions:
  contents: read

jobs:
  nightly:
    name: MANTA nightly
    runs-on: ubuntu-latest
    env:
      MANTA_SECRET_DEMO_PW: ${{ secrets.MANTA_SECRET_DEMO_PW }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check the sign-in secret
        if: env.MANTA_SECRET_DEMO_PW == ''
        run: |
          echo "::warning::MANTA_SECRET_DEMO_PW is not set; the sign-in path will be held."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install, Chromium, build and preview on localhost:4173, in one composite action.
      - uses: ./.github/actions/manta-setup
        with:
          manta-read-token: ${{ secrets.MANTA_READ_TOKEN }}

      # 5d1e7a42 is the "Sign in" path in sites/http_localhost_4173.json.
      - name: Scan, with the AI pass
        if: env.ANTHROPIC_API_KEY != ''
        run: npx manta scan --base http://localhost:4173 --extended --paths 5d1e7a42 --name "Nightly" --series nightly --skills cluster,fix,explain,summary,adjudicate,acr --provider anthropic-api --no-nudge

      - name: Scan
        if: env.ANTHROPIC_API_KEY == ''
        run: npx manta scan --base http://localhost:4173 --extended --paths 5d1e7a42 --name "Nightly" --series nightly --no-nudge

      - name: Name the artifact
        if: always()
        run: |
          echo "Artifact: manta-nightly" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manta-nightly
          retention-days: 30
          path: |
            reports/
            run-records/
            sites/
