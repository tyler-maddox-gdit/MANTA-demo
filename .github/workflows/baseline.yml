name: Baseline

on:
  push:
    branches: [main]

concurrency:
  group: baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  baseline:
    name: MANTA baseline
    runs-on: ubuntu-latest
    steps:
      # The deploy key is the ruleset's bypass: it may push to main without the gate check.
      # A deploy-key push starts workflows (only a GITHUB_TOKEN push does not), so the commit says [skip ci].
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.MANTA_DEMO_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install, Chromium, build and preview on localhost:4173, in one composite action.
      - uses: ./.github/actions/manta-setup
        with:
          manta-read-token: ${{ secrets.MANTA_READ_TOKEN }}

      - name: Baseline
        run: npx manta baseline --base http://localhost:4173 --no-nudge

      - name: Draw the badge
        run: node .github/scripts/badge.mjs

      - name: Commit the baseline and the badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .manta/baseline.json .manta/badge.svg
          # The baseline's "at" is the scan's own time, new on every run: a change to it alone is no change.
          if git diff --cached --quiet -I '^  "at": '; then
            echo "The baseline and the badge are unchanged; nothing to commit."
          else
            git commit -m "Baseline: tolerated debt as measured on main [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manta-run
          path: |
            reports/
            run-records/
            sites/
