name: Gate

on:
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the run still going: committing suggestions one at a time
# leaves one run to finish, not one per commit.
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gate:
    name: MANTA gate
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MANTA_ARTIFACT_NAME: manta-run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install, Chromium, build and preview on localhost:4173, in one composite action.
      - uses: ./.github/actions/manta-setup
        with:
          manta-read-token: ${{ secrets.MANTA_READ_TOKEN }}

      # The demo keeps each CI gate short: it scans the one page the upload dialog changes. The developer's gate
      # on the laptop (the Dev stage) scans every page in the config. Pages the baseline holds and this run does not
      # scan are left alone, so the verdict is the same New 3.
      - name: Gate the upload page alone
        run: node -e "const fs=require('fs'),f='.manta/config.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.pages=['/status?upload=BP-2026-10882'];fs.writeFileSync(f,JSON.stringify(c,null,2))"

      # The pivot: with ANTHROPIC_API_KEY set the gate also proposes fixes for the new violations.
      - name: Gate, with AI fixes
        id: gate_ai
        if: env.ANTHROPIC_API_KEY != ''
        continue-on-error: false
        run: npx manta gate --base http://localhost:4173 --skills cluster,fix --scope new --provider anthropic-api --no-nudge

      - name: Gate
        id: gate
        if: env.ANTHROPIC_API_KEY == ''
        continue-on-error: false
        run: npx manta gate --base http://localhost:4173 --no-nudge

      # The steps below run whatever the gate said; a failed gate step still fails the job.
      # The keyless demo. No AI runs in this job without ANTHROPIC_API_KEY, so on the demo's own feature branch
      # the fix skill's pre-run output (demo-data/pr: a snapshot of this branch, its fixes written on the Mac) is
      # posted as a review the presenter can apply, with a comment saying it is pre-run. Only while those fixes
      # still apply: the run after they are committed posts nothing. Before the live post, which then rewrites
      # MANTA's comment with this job's own result.
      - name: Post the pre-run AI fixes (demo, no key)
        if: always() && env.ANTHROPIC_API_KEY == '' && github.head_ref == 'feature/upload-documents'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          patch=$(ls demo-data/pr/reports/fix-*.patch)
          token=$(basename "$patch" .patch); token=${token#fix-}
          if ! git apply --check "$patch" 2>/dev/null; then
            echo "The pre-run fixes no longer apply to this branch: nothing posted."
            exit 0
          fi
          dir="$RUNNER_TEMP/prerun"
          mkdir -p "$dir/reports"
          cp demo-data/pr/reports/* "$dir/reports/"
          (cd "$dir" && GITHUB_STEP_SUMMARY= node "$GITHUB_WORKSPACE/node_modules/@usps/508-toolkit/bin/manta.mjs" post --pr "$PR" --run "$token" > /dev/null)
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "**Pre-run AI fixes.** No AI ran in this job: the repository has no \`ANTHROPIC_API_KEY\`. The suggestions in MANTA's review were written by MANTA's fix skill ahead of time, on a snapshot of this branch (run \`$token\`, kept in \`demo-data/pr\`), and posted here so they can be applied. With a key set, this job writes its own."
          echo "Posted the pre-run fixes of run $token."

      # Never on the golden PR: its comment and review are the pre-run ones, posted once, and this would rewrite them.
      - name: Post to the pull request
        if: always() && github.head_ref != 'golden/upload-documents'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx manta post --pr ${{ github.event.pull_request.number }}

      # Under MANTA's review: a comment whose checkbox applies every one of its suggestions in one commit
      # (apply-fixes.yml), so the gate runs once rather than once per suggestion committed.
      - name: Offer to apply every suggestion in one commit
        if: always() && github.head_ref != 'golden/upload-documents'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/apply-fixes.mjs offer

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manta-run
          path: |
            reports/
            run-records/
            sites/

      - name: Find the SARIF file
        id: sarif
        if: always()
        # Run tokens are ISO timestamps, so the last name sorted is the newest run's.
        run: echo "file=$(find reports -maxdepth 1 -name 'gate-*.sarif' 2>/dev/null | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload to code scanning
        if: always() && steps.sarif.outputs.file != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: manta
